name: CI

# A change is tested in full once, on its PR. A push to main only builds and runs the unit tests, and a release
# (release.yml) smoke-tests its own zips on one Jellyfin per track.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Release number X.Y (the tag without v); release.yml passes it
        type: string
        default: '0.0'
      changelog:
        description: Changelog text for the manifest and the zips
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build, test, package
    runs-on: ubuntu-latest
    outputs:
      smoke: ${{ steps.smoke.outputs.matrix }}
      smoke-any: ${{ steps.smoke.outputs.any }}
    steps:
      - uses: actions/checkout@v7

      # Not actions/setup-dotnet: it resolves "9.0.x" through aka.ms links, whose storage refused public access on
      # 2026-10-25. The install script skips aka.ms when given an exact version, so each channel's latest version is
      # read from builds.dotnet.microsoft.com and installed from there.
      - name: Install .NET 9 and 10
        run: |
          curl -sSfL https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          for channel in 9.0 10.0; do
            version=$(curl -sSfL "https://builds.dotnet.microsoft.com/dotnet/Sdk/$channel/latest.version" | tail -n1 | tr -d '\r')
            bash "$RUNNER_TEMP/dotnet-install.sh" --version "$version" --install-dir "$HOME/.dotnet"
          done
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"

      - name: Build (net9.0 + net10.0, warnings are errors)
        run: dotnet build Jellyfin.Plugin.TgJelly.slnx -c Release

      - name: Unit tests (both frameworks)
        run: dotnet test --solution Jellyfin.Plugin.TgJelly.slnx -c Release --no-build

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dashboard page tests
        run: |
          node --check src/Jellyfin.Plugin.TgJelly/Web/tgjelly.js
          node --check src/Jellyfin.Plugin.TgJelly/Web/tgjelly-ui.js
          node --check src/Jellyfin.Plugin.TgJelly/Web/tgjelly-autosave.js
          node --check src/Jellyfin.Plugin.TgJelly/Web/tgjelly-messages.js
          node --check src/Jellyfin.Plugin.TgJelly/Web/tgjelly-preview.js
          node --check src/Jellyfin.Plugin.TgJelly/Web/tgjelly-log.js
          node --check src/Jellyfin.Plugin.TgJelly/Web/tgjelly-api.js
          node --check src/Jellyfin.Plugin.TgJelly/Web/tgjelly-shell.js
          node --check src/Jellyfin.Plugin.TgJelly/Web/tgjelly-overview.js
          node --check src/Jellyfin.Plugin.TgJelly/Web/tgjelly-destinations.js
          node --check src/Jellyfin.Plugin.TgJelly/Web/tgjelly-advanced.js
          node --import ./tests/web/jellyfin-resolve.mjs --test 'tests/web/*.test.mjs'

      - name: Script tests
        run: |
          python3 -m unittest discover -s build -p 'test_*.py' -v
          python3 -m unittest discover -s tests/integration -p 'test_*.py' -v

      # Only release.yml calls this workflow with a real release; push and PR runs package 0.0 as before.
      - name: Check out the plugin repository manifest (release only)
        if: inputs.release != '' && inputs.release != '0.0'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages

      - name: Package both tracks
        env:
          RELEASE: ${{ inputs.release || '0.0' }}
          CHANGELOG: ${{ inputs.changelog || format('CI build {0}', github.sha) }}
        run: |
          args=(--release "$RELEASE" --changelog "$CHANGELOG" --output artifacts)
          if [ "$RELEASE" != "0.0" ]; then
            args+=(--source-url-base "https://github.com/MrSnowball-dev/tgjelly_plugin/releases/download/v$RELEASE")
            if [ -f pages/manifest.json ]; then args+=(--manifest-in pages/manifest.json); fi
          fi
          python3 build/package.py "${args[@]}"

      - name: List publish output (spec §15 Q7)
        run: ls -1 artifacts/publish/net9.0 artifacts/publish/net10.0

      # .github/smoke-matrix.json lists every smoke run; a release keeps the entries marked "release", a push to main none.
      - name: Choose the smoke runs
        id: smoke
        env:
          MODE: ${{ (inputs.release != '' && inputs.release != '0.0') && 'release' || github.event_name == 'push' && 'none' || 'full' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          mode = os.environ["MODE"]
          runs = json.load(open(".github/smoke-matrix.json"))
          keep = [] if mode == "none" else [r for r in runs if mode == "full" or r.get("release")]
          print("matrix=" + json.dumps({"include": [{k: r[k] for k in ("image", "track", "args")} for r in keep]}))
          print("any=" + ("true" if keep else "false"))
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            artifacts/*.zip
            artifacts/manifest.json

  smoke:
    name: Smoke ${{ matrix.image }} track ${{ matrix.track }} ${{ matrix.args }}
    needs: build
    if: needs.build.outputs.smoke-any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # A track, not a file name: a release run packages tgjelly_<track>.X.Y.0.zip, and smoke.py finds it (--track).
      # Spec F8's entry (12.2 with track 1, --expect-incompatible): after a 10.11 -> 12 upgrade the old build keeps
      # loading until it is updated.
      matrix: ${{ fromJSON(needs.build.outputs.smoke) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts

      - name: Install the plugin into a real Jellyfin and check it
        run: python3 tests/integration/smoke.py --image ${{ matrix.image }} --track ${{ matrix.track }} --artifacts artifacts ${{ matrix.args }}
