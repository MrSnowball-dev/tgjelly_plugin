<div data-role="page" id="tgjConfigPage" class="page type-interior pluginConfigurationPage" data-controller="__plugin/tgjelly.js">
    <style>
        #tgjConfigPage .tgj-badge {
            display: inline-block;
            padding: 0.1em 0.6em;
            border: 1px solid currentColor;
            border-radius: 1em;
            font-size: 0.85em;
            white-space: nowrap;
        }

        #tgjConfigPage .tgj-changed {
            outline: 2px solid var(--jf-palette-warning-main);
            outline-offset: 2px;
        }

        #tgjConfigPage .tgj-error {
            color: var(--jf-palette-error-main);
        }

        #tgjConfigPage .tgj-notice {
            display: flex;
            align-items: center;
            gap: 1em;
            margin: 0.5em 0;
            padding: 0.5em 0.8em;
            border-left: 3px solid var(--jf-palette-warning-main);
        }

        #tgjConfigPage .tgj-notice-text {
            flex: 1;
        }

        #tgjConfigPage .tgj-errors {
            margin: 0.3em 0;
            padding-left: 1.2em;
        }

        #tgjConfigPage .tgj-advanced > summary {
            cursor: pointer;
            margin: 1em 0;
        }

        #tgjConfigPage .tgj-advanced > summary > .sectionTitle {
            display: inline;
        }

        #tgjConfigPage .tgj-tpl-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1em;
        }

        #tgjConfigPage .tgj-tpl-head > .selectContainer {
            flex: 1;
            min-width: 14em;
        }

        #tgjConfigPage .tgj-tpl-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1em;
            margin: 1em 0;
        }

        #tgjConfigPage .tgj-tpl-grid > * {
            min-width: 0;
        }

        @media (max-width: 700px) {
            #tgjConfigPage .tgj-tpl-grid {
                grid-template-columns: 1fr;
            }
        }

        #tgjConfigPage .tgj-template-text {
            box-sizing: border-box;
            width: 100%;
            font-family: monospace;
        }

        #tgjConfigPage .tgj-tg {
            max-width: 28em;
            border-radius: 0.8em;
            overflow: hidden;
            background: var(--jf-palette-background-paper, rgba(127, 127, 127, 0.15));
            box-shadow: 0 0 0 1px rgba(127, 127, 127, 0.25);
        }

        #tgjConfigPage .tgj-tg.tgj-stale {
            opacity: 0.45;
        }

        #tgjConfigPage .tgj-tg-poster {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 9em;
            background: rgba(127, 127, 127, 0.3);
            opacity: 0.8;
        }

        #tgjConfigPage .tgj-tg-text {
            padding: 0.6em 0.8em;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        #tgjConfigPage .tgj-tg-text a {
            color: var(--jf-palette-primary-main, #00a4dc);
        }

        #tgjConfigPage .tgj-tg-text blockquote,
        #tgjConfigPage .tgj-quote {
            margin: 0.3em 0;
            padding: 0.2em 0.6em;
            border-left: 3px solid var(--jf-palette-primary-main, #00a4dc);
            background: rgba(127, 127, 127, 0.1);
        }

        #tgjConfigPage .tgj-quote > summary {
            cursor: pointer;
        }

        #tgjConfigPage .tgj-tg-text pre {
            margin: 0.3em 0;
            white-space: pre-wrap;
        }

        #tgjConfigPage .tgj-spoiler {
            border-radius: 0.2em;
            background: rgba(127, 127, 127, 0.35);
            filter: blur(0.25em);
            cursor: pointer;
        }

        #tgjConfigPage .tgj-spoiler.tgj-revealed {
            background: rgba(127, 127, 127, 0.15);
            filter: none;
        }

        #tgjConfigPage .tgj-tg-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.25em;
            padding: 0 0.4em 0.4em;
        }

        #tgjConfigPage .tgj-tg-row {
            display: flex;
            gap: 0.25em;
        }

        #tgjConfigPage .tgj-tg-button {
            flex: 1;
            padding: 0.4em;
            border-radius: 0.4em;
            background: rgba(127, 127, 127, 0.25);
            color: inherit;
            text-align: center;
            text-decoration: none;
            overflow-wrap: anywhere;
        }

        #tgjConfigPage .tgj-tpl-test {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1em;
        }

        #tgjConfigPage .tgj-tpl-test > .selectContainer {
            min-width: 14em;
            margin-bottom: 0;
        }
    </style>
    <div data-role="content">
        <div class="content-primary">
            <div id="tgj-status"></div>
            <div id="tgj-connect"></div>
            <div id="tgj-bot"></div>
            <div id="tgj-destinations"></div>
            <div id="tgj-messages"></div>
            <div id="tgj-templates"></div>
            <details id="tgj-advanced" class="tgj-advanced" hidden>
                <summary><h2 class="sectionTitle"><span id="tgj-advanced-title"></span></h2></summary>
                <div id="tgj-proxy"></div>
                <div id="tgj-batching"></div>
                <div id="tgj-updates"></div>
                <div id="tgj-manual"></div>
                <div id="tgj-diagnostics"></div>
            </details>
        </div>
    </div>
</div>
